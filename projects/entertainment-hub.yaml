substitutions:
  device_name: entertainment-hub
  friendly_name: Entertainment Hub
  channel_1: TV
  channel_2: HTPC
  max_power: "3000.0" # watt
  max_temp: "92.0" # °C

packages:
  - !include packages/shelly-base.yaml

i2c:
  sda: GPIO12
  scl: GPIO14

# Text sensors with general information.
text_sensor:
  - platform: version
    name: ${friendly_name} ESPHome Version

# Sensors with general information.
sensor:
  - platform: ade7953_i2c
    voltage:
      name: ${friendly_name} voltage
    current_a:
      name: ${channel_2} current
      internal: true
    current_b:
      name: ${channel_1} current
      internal: true
    active_power_a:
      name: ${channel_2} power
      id: power_channel_2
      filters:
        - multiply: 1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: shelly_relay_2
            # TODO: send mqtt message
            # - homeassistant.service:
            #     service: persistent_notification.create
            #     data:
            #       title: Message from ${friendly_name}
            #     data_template:
            #       message: Switch turned off because power exceeded ${max_power}W
    active_power_b:
      name: ${channel_1} power
      id: power_channel_1
      filters:
        - multiply: -1
      on_value_range:
        - above: ${max_power}
          then:
            - switch.turn_off: shelly_relay_1
            # TODO: send MQTT message
            # - homeassistant.service:
            #     service: persistent_notification.create
            #     data:
            #       title: Message from ${friendly_name}
            #     data_template:
            #       message: Switch turned off because power exceeded ${max_power}W
    update_interval: 30s

  # NTC Temperature
  - platform: ntc
    sensor: temp_resistance_reading
    name: ${friendly_name} temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - switch.turn_off: shelly_relay_1
          - switch.turn_off: shelly_relay_2
          # TODO: send MQTT message
          # - homeassistant.service:
          #     service: persistent_notification.create
          #     data:
          #       title: Message from ${device_name}
          #     data_template:
          #       message: Switch turned off because temperature exceeded ${max_temp}°C
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 32kOhm
  - platform: adc
    id: temp_analog_reading
    pin: A0

status_led:
  pin:
    number: GPIO0
    inverted: yes

switch:
  - platform: gpio
    pin: GPIO4
    id: shelly_relay_1
    name: "${channel_1}"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO15
    id: shelly_relay_2
    name: "${channel_2}"
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
    name: "${channel_1} input"
    internal: true
    on_state:
      then:
        - switch.toggle: shelly_relay_1
  - platform: gpio
    pin:
      number: GPIO5
    name: "${channel_2} input"
    internal: true
    on_state:
      then:
        - switch.toggle: shelly_relay_2

  # Prevent short circuit with "floating" pin!
  - platform: gpio
    pin: GPIO16
    name: "ade7953 IRQ pin"
    internal: true
