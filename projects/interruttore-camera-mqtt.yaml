# Shelly 1 detached switch config
# with fallback in case of wifi or api fail
substitutions:
  device_name: interruttore-camera
  friendly_name: Interruttore camera
  relay_id: shelly_relay
  button_id: button1

packages:
  - !include packages/shelly-base.yaml

switch:
  - platform: gpio
    name: ${friendly_name}
    pin: GPIO4
    id: ${relay_id}
    # after reboot, keep the relay off.
    # this prevents light turning on after a power outage
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: ${friendly_name} Input
    pin: GPIO5
    id: ${button_id}
    internal: true
    filters:
      delayed_on_off: 50ms

    on_click:
      min_length: 50ms
      max_length: 350ms
      then: !include
        file: packages/publish-mqtt-or-toggle.yaml
        vars:
          topic: zigbee2mqtt/luci_camera/set
          payload: '{ "scene_recall": 2 }'

    on_press:
      then: !include
        file: packages/publish-mqtt-or-toggle.yaml
        vars:
          topic: zigbee2mqtt/luci_camera/set
          payload: '{ "scene_recall": 1 }'

    on_release:
      then: !include
        file: packages/publish-mqtt-or-toggle.yaml
        vars:
          topic: zigbee2mqtt/luci_camera/set
          payload: '{ "scene_recall": 0 }'
